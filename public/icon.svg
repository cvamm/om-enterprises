<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#0b0b0c"/>
  <!-- hexagonal stone slab, gold -->
  <polygon points="92,50 71,86 29,86 8,50 29,14 71,14" fill="#c9a96a"/>
  <polygon points="92,50 71,86 29,86 8,50 29,14 71,14" fill="none" stroke="#8a6f33" stroke-width="2"/>
  <!-- four slab seams from centre to vertices -->
  <g stroke="#0b0b0c" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="50" x2="92" y2="50"/>
    <line x1="50" y1="50" x2="8" y2="50"/>
    <line x1="50" y1="50" x2="71" y2="14"/>
    <line x1="50" y1="50" x2="29" y2="86"/>
  </g>
  <!-- lighter centre diamond, marble-like -->
  <polygon points="50,30 68,50 50,70 32,50" fill="#e0d8c8" opacity="0.5"/>
  <!-- subtle stone vein -->
  <path d="M20 62 C 40 42, 60 66, 82 46" stroke="#b89b6a" stroke-width="1.4" fill="none" opacity="0.55"/>
</svg>
